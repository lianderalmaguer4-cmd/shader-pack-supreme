#SHADER PACK SUPREME - Configuración de Shaders
#Calidad Alta | Realista | Configurable para Iris 1.10.7

# ====== INFORMACIÓN ======
screen = [General] [Shadows] [Water] [Bloom] [Advanced]

# ====== GENERAL ======
screen.General = General Options

uniform.int.frameCounter = 0

# Normalización de valores
option.renderShadows = Renderizar Sombras
value.renderShadows.0 = false
value.renderShadows.1 = true

# ====== SHADOWS ======
screen.Shadows = Shadow Configuration

uniform.float.shadowDistance = Shadow Distance
value.shadowDistance.1.0 = 512.0
value.shadowDistance.2.0 = 1024.0
value.shadowDistance.3.0 = 2048.0
slider.shadowDistance = 512 2048 512

uniform.float.shadowFadeStart = Shadow Fade Start
slider.shadowFadeStart = 256 1024 64

uniform.float.shadowStrength = Shadow Strength
slider.shadowStrength = 0.0 1.0 0.1
default.shadowStrength = 0.8

uniform.float.normalMapStrength = Normal Map Strength
slider.normalMapStrength = 0.0 1.0 0.1
default.normalMapStrength = 0.5

# ====== WATER ======
screen.Water = Water Configuration

uniform.float.waveAmplitude = Wave Amplitude
slider.waveAmplitude = 0.0 0.5 0.05
default.waveAmplitude = 0.25

uniform.float.waveFrequency = Wave Frequency
slider.waveFrequency = 0.5 5.0 0.5
default.waveFrequency = 2.0

uniform.float.waveSpeed = Wave Speed
slider.waveSpeed = 0.0 2.0 0.1
default.waveSpeed = 0.5

uniform.float.waterRefractionStrength = Water Refraction Strength
slider.waterRefractionStrength = 0.0 0.5 0.05
default.waterRefractionStrength = 0.15

uniform.float.waterReflectionStrength = Water Reflection Strength
slider.waterReflectionStrength = 0.0 1.0 0.1
default.waterReflectionStrength = 0.8

uniform.float.waterTransparency = Water Transparency
slider.waterTransparency = 0.0 1.0 0.1
default.waterTransparency = 0.6

uniform.float.waterNormalStrength = Water Normal Strength
slider.waterNormalStrength = 0.0 1.0 0.1
default.waterNormalStrength = 0.3

uniform.float.waterSpecular = Water Specular
slider.waterSpecular = 0.0 2.0 0.1
default.waterSpecular = 1.0

# ====== BLOOM ======
screen.Bloom = Bloom Configuration

uniform.float.bloomIntensity = Bloom Intensity
slider.bloomIntensity = 0.0 2.0 0.1
default.bloomIntensity = 1.0

uniform.float.bloomRadius = Bloom Radius
slider.bloomRadius = 1.0 20.0 1.0
default.bloomRadius = 8.0

uniform.float.bloomThreshold = Bloom Threshold
slider.bloomThreshold = 0.0 1.0 0.05
default.bloomThreshold = 0.7

# ====== ADVANCED ======
screen.Advanced = Advanced Options

uniform.float.godrayIntensity = God Ray Intensity
slider.godrayIntensity = 0.0 2.0 0.1
default.godrayIntensity = 0.8

uniform.float.godraySteps = God Ray Quality
slider.godraySteps = 8.0 64.0 8.0
default.godraySteps = 32.0

uniform.float.toneMapingStrength = Tone Mapping Strength
slider.toneMapingStrength = 0.0 2.0 0.1
default.toneMapingStrength = 1.0

uniform.float.saturation = Color Saturation
slider.saturation = 0.0 2.0 0.1
default.saturation = 1.2

uniform.float.roughness = Surface Roughness (PBR)
slider.roughness = 0.0 1.0 0.05
default.roughness = 0.5

uniform.float.metallic = Metallic Factor (PBR)
slider.metallic = 0.0 1.0 0.05
default.metallic = 0.1

uniform.float.ambientOcclusion = Ambient Occlusion
slider.ambientOcclusion = 0.0 1.0 0.05
default.ambientOcclusion = 1.0

# ====== PERFIL PRESETS ======
profile.Ultra = Ultra High Quality
profile.Ultra.shadowDistance = 2048
profile.Ultra.bloomIntensity = 1.5
profile.Ultra.godrayIntensity = 1.0
profile.Ultra.waveAmplitude = 0.35
profile.Ultra.saturation = 1.3
profile.Ultra.normalMapStrength = 0.7

profile.High = High Quality
profile.High.shadowDistance = 1024
profile.High.bloomIntensity = 1.0
profile.High.godrayIntensity = 0.8
profile.High.waveAmplitude = 0.25

profile.Medium = Medium Quality
profile.Medium.shadowDistance = 512
profile.Medium.bloomIntensity = 0.7
profile.Medium.godrayIntensity = 0.5
profile.Medium.waveAmplitude = 0.15

profile.Low = Low Quality (Fast)
profile.Low.shadowDistance = 256
profile.Low.bloomIntensity = 0.3
profile.Low.godrayIntensity = 0.2
profile.Low.waveAmplitude = 0.1
